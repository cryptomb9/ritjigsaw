<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ritual puzzle artwork</title>
  <desc id="desc">Geometric black, green, lime, pink, and gold puzzle artwork.</desc>
  <defs>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#19D184" />
      <stop offset="1" stop-color="#BFFF00" />
    </linearGradient>
    <linearGradient id="pink" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FF1DCE" />
      <stop offset="1" stop-color="#FACC15" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#000000" />
  <rect x="70" y="70" width="1060" height="1060" fill="#111827" stroke="#374151" stroke-width="4" />
  <g opacity="0.32">
    <path d="M0 300H1200M0 600H1200M0 900H1200M300 0V1200M600 0V1200M900 0V1200" stroke="#374151" stroke-width="5" />
  </g>
  <g filter="url(#glow)">
    <path d="M600 180L930 600L600 1020L270 600Z" fill="none" stroke="url(#green)" stroke-width="32" />
    <path d="M600 310L810 600L600 890L390 600Z" fill="none" stroke="url(#pink)" stroke-width="26" />
    <circle cx="600" cy="600" r="76" fill="#000000" stroke="#19D184" stroke-width="24" />
  </g>
  <g>
    <rect x="126" y="126" width="210" height="210" fill="#000000" stroke="#19D184" stroke-width="12" />
    <rect x="864" y="126" width="210" height="210" fill="#000000" stroke="#FF1DCE" stroke-width="12" />
    <rect x="126" y="864" width="210" height="210" fill="#000000" stroke="#FACC15" stroke-width="12" />
    <rect x="864" y="864" width="210" height="210" fill="#000000" stroke="#BFFF00" stroke-width="12" />
  </g>
  <g fill="#D1D5DB" font-family="Arial, sans-serif" font-size="82" font-weight="700" text-anchor="middle">
    <text x="600" y="115">RITUAL</text>
    <text x="600" y="1120">JIGSAW</text>
  </g>
</svg>
